# Node.js: install with npm ci and run npm test on two Node versions.
# npm's download cache is kept between runs.
jobs:
  test:
    matrix:
      node: [20, 22]
    image: "node:${{ matrix.node }}"
    cache:
      key: npm-${{ matrix.node }}-{{ hash package-lock.json }}
      restore-keys: [npm-]
      paths: [.npm]
    steps:
      - name: Install
        run: npm ci --cache "$GITTER_WORKSPACE/.npm"
      - name: Test
        run: npm test
