[package]
name = "gitter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
# Server identity for federation (already in the tree through russh).
ed25519-dalek = "3.0.0"
flate2 = "1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
mime_guess = "2.0.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
# Git over SSH. ring (already here for rustls) instead of aws-lc-rs, which needs cmake to build.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "set-header", "limit"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
